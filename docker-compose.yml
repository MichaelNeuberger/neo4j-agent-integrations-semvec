# ABOUTME: Neo4j plus the demo image: one-off seed, interactive demo and test suite against containerised Neo4j.
# ABOUTME: Settings and secrets come from .env; NEO4J_TEST_URI is pointed at the neo4j service.

name: semvec-neo4j

x-app: &app
  build: .
  image: semvec-neo4j-demo
  env_file: .env
  environment:
    NEO4J_TEST_URI: bolt://neo4j:7687
  extra_hosts:
    # Lets OPENAI_BASE_URL reach an LLM endpoint on the Docker host via host.docker.internal.
    - "host.docker.internal:host-gateway"
  volumes:
    - hf-cache:/home/app/.cache/huggingface
  depends_on:
    neo4j:
      condition: service_healthy

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_TEST_PASSWORD:?set NEO4J_TEST_PASSWORD in .env}
      # Neo4j Browser runs in your web browser and connects to the bolt address
      # the server advertises; advertise the host port, not the container's 7687.
      NEO4J_server_bolt_advertised__address: localhost:7689
    ports:
      # Loopback only: the demo database is not meant to be reachable from the network.
      - "127.0.0.1:7476:7474"
      - "127.0.0.1:7689:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  seed:
    <<: *app
    command: ["python", "scripts/seed_test_data.py"]
    profiles: ["tools"]

  demo:
    <<: *app
    stdin_open: true
    tty: true
    profiles: ["tools"]

  test:
    <<: *app
    command: ["python", "-m", "pytest", "-q"]
    profiles: ["tools"]

volumes:
  neo4j-data:
  hf-cache:
